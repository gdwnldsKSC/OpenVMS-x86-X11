Section "ServerFlags"
    Option "AutoAddDevices" "true"
    Option "AutoEnableDevices" "true"
    Option "DontVTSwitch" "true"
    Option "DontZap" "true"
    Option "BlankTime" "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime" "0"
EndSection

Section "Device"
    Identifier "VMware"
    Driver "vmware"
    Option "MTRR" "false"
EndSection

Section "Screen"
    Identifier "Screen"
    Device "VMware"
    DefaultDepth 24
EndSection

Section "ServerLayout"
    Identifier "Video only"
    Screen "Screen"
EndSection
