# Upstream fbdev with the OpenVMS boot-framebuffer provider.
# The layout placeholders below deliberately prevent startup until verified.
# Address and geometry come from OpenVMS. Leave BusID and custom modes unset.
Section "ServerFlags"
    Option "AutoAddDevices" "true"
    Option "AutoEnableDevices" "true"
    Option "AutoAddGPU" "false"
    Option "DontVTSwitch" "true"
    Option "DontZap" "true"
    Option "BlankTime" "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime" "0"
EndSection

Section "Device"
    Identifier "Boot framebuffer"
    Driver "fbdev"
    Option "fbdev" "HWRPB"
    Option "ShadowFB" "true"
    # Replace 0 with the verified scanline stride in bytes, including padding.
    Option "StrideBytes" "0"
    # Set XRGB8888 for B,G,R,X bytes or XBGR8888 for R,G,B,X bytes.
    # Verify firmware pixel order; do not infer it from the GPU model.
    Option "PixelFormat" ""
EndSection

Section "Screen"
    Identifier "Screen"
    Device "Boot framebuffer"
    DefaultDepth 24
EndSection

Section "ServerLayout"
    Identifier "Framebuffer video only"
    Screen "Screen"
EndSection
